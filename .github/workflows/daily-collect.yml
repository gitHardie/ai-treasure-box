name: daily-collect

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'  # 每天UTC 18:00 (北京凌晨2:00)
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式: discovery/health_check/deep_update'
        required: false
        type: string
        default: 'auto'
      source:
        description: '指定数据源ID（可选）'
        required: false
        type: string

env:
  PYTHON_VERSION: '3.11'

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          COZE_API_KEY: ${{ secrets.AI_BOX_COZE }}
          COZE_WORKFLOW_ID: ${{ secrets.COZE_WORKFLOW_ID }}
          PH_API_KEY: ${{ secrets.PH_API_KEY }}
          PH_API_SECRET: ${{ secrets.PH_API_SECRET }}
        run: |
          cd scripts
          MODE_ARG="${{ inputs.mode }}"
          SOURCE_ARG="${{ inputs.source }}"
          if [ "$MODE_ARG" = "url_fix" ]; then
            python main.py url_fix
            python main.py deploy
          elif [ "$MODE_ARG" = "auto" ] || [ -z "$MODE_ARG" ]; then
            python main.py run
          elif [ -n "$SOURCE_ARG" ]; then
            python main.py discover --source "$SOURCE_ARG"
            python main.py analyze
            python main.py deploy
          else
            python main.py run --mode "$MODE_ARG"
          fi

      - name: Transform news data
        run: python scripts/news_transform.py
      - name: Commit and push
        run: |
          git config user.name "AI Treasure Box Bot"
          git config user.email "bot@afterai.tech"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "📊 Data update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          
          # Retry loop for pull-rebase with conflict resolution (max 3 attempts)
          for attempt in 1 2 3; do
            echo "=== Push attempt $attempt ==="
            if git pull --rebase origin main; then
              echo "Rebase succeeded, pushing..."
              git push && echo "Push successful" && exit 0
            fi
            
            echo "Rebase conflict detected, resolving..."
            # For data files, accept our version (freshly computed pipeline data)
            git diff --name-only --diff-filter=U | while read conflict_file; do
              echo "Resolving conflict in: $conflict_file"
              git checkout --ours "$conflict_file"
              git add "$conflict_file"
            done
            
            if git rebase --continue; then
              echo "Rebase resolved, pushing..."
              git push && echo "Push successful" && exit 0
            fi
            
            echo "Attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          
          echo "ERROR: Failed to push after 3 attempts"
          exit 1

  deploy-site:
    needs: collect-and-analyze
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Build and deploy
        run: |
          mkdir -p site/public/data
          cp -r data/site/* site/public/data/ 2>/dev/null || true
          cd site && npm install && npm run build
          cd dist
          git init
          git config user.name "AI Treasure Box Bot"
          git config user.email "bot@afterai.tech"
          git checkout -b gh-pages
          echo "tools.afterai.tech" > CNAME
          cp index.html 404.html
          git add -A
          git commit -m "🚀 Deploy: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin gh-pages --force